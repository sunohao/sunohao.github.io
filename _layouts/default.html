<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  {%- seo -%}
  <style>
:root{
  --w: 1080px;
  --r: 16px;
  --b: #e6e6e6;
  --paper: #f9fafb;
  --ink: #0b1020;
  --muted: #5a6475;
  --acc: #8d1a11;
  --acc-2: #b24a3f;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  font:16px/1.65 system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,"Apple Color Emoji","Segoe UI Emoji";
  color:var(--ink);
  background:
    radial-gradient(1200px 500px at 50% -200px, rgba(141,26,17,.05), transparent 60%),
    var(--paper);
}

.wrap{max-width:var(--w); margin:0 auto; padding:0 20px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.skip:focus{position:fixed;inset:16px auto auto 16px;background:#fff;padding:8px 12px;border-radius:10px;box-shadow:0 8px 30px rgba(0,0,0,.12)}

.site-header{
  position:sticky;top:0;z-index:40;
  backdrop-filter:saturate(130%) blur(6px);
  background:linear-gradient(180deg, rgba(255,255,255,.92), rgba(255,255,255,.86));
  border-bottom:1px solid var(--b);
}
.h-row{height:64px;display:flex;align-items:center;justify-content:space-between;gap:18px}
.brand a{display:inline-block;text-decoration:none;font-weight:700;letter-spacing:.2px;color:var(--acc);}
.nav a{
  display:inline-block;margin:0 6px;padding:10px 12px;border-radius:12px;text-decoration:none;
  color:#14203a;position:relative;transition:background .2s ease, transform .08s ease;
}
.nav a:hover{background:rgba(14,165,165,.08)}
.nav a.active{color:#fff;background:#8d1a11;box-shadow:0 2px 10px rgba(141,26,17,.24)}

main{padding:30px 0 64px}
.eyebrow{font-size:16px;font-weight:700;letter-spacing:.08em;color:var(--acc);text-transform:uppercase}

.hero{padding:56px 0 40px;border-bottom:1px solid var(--b)}
.hero-split{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(280px,.75fr);gap:54px;align-items:center}
.hero h1{font-size:clamp(34px,4.2vw,44px);line-height:1.12;letter-spacing:-.025em;margin:10px 0 0}
.hero-lead{font-size:18px;line-height:1.55;max-width:760px;margin-top:16px;letter-spacing:-.005em}
.hero-meta{font-size:18px;line-height:1.5;color:var(--muted);margin-top:12px}
.cta-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}

.hero-visual{
  position:relative;min-height:290px;border:1px solid var(--b);border-radius:24px;overflow:hidden;
  background:linear-gradient(145deg,rgba(141,26,17,.06),rgba(14,165,165,.05)),#fff;
  box-shadow:0 14px 40px rgba(19,33,68,.06);
}
.hero-image{display:flex;align-items:center;justify-content:center;background:#fff}
.hero-image img{display:block;width:100%;height:100%;min-height:290px;object-fit:cover}
.moire-grid{
  position:absolute;inset:-35px;
  background-image:
    linear-gradient(30deg,rgba(141,26,17,.08) 1px,transparent 1px),
    linear-gradient(150deg,rgba(14,165,165,.08) 1px,transparent 1px);
  background-size:28px 28px;
  transform:rotate(4deg);
}
.orbit{position:absolute;border:1.5px solid rgba(141,26,17,.34);border-radius:50%}
.orbit-a{width:170px;height:170px;left:63px;top:58px}
.orbit-b{width:215px;height:112px;left:40px;top:88px;transform:rotate(33deg)}
.orbit-c{width:215px;height:112px;left:40px;top:88px;transform:rotate(-33deg);border-color:rgba(14,165,165,.34)}
.core-dot{position:absolute;width:14px;height:14px;border-radius:50%;left:141px;top:136px;background:var(--acc);box-shadow:0 0 0 9px rgba(141,26,17,.08)}
.visual-label{position:absolute;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);background:rgba(255,255,255,.78);padding:4px 7px;border-radius:999px;border:1px solid rgba(230,230,230,.8)}
.label-a{left:24px;top:28px}.label-b{right:22px;top:44px}.label-c{right:30px;bottom:24px}

.btn{display:inline-block;padding:10px 16px;border-radius:12px;border:1px solid var(--b);background:#fff;color:#111;text-decoration:none;box-shadow:0 1px 2px rgba(0,0,0,.06);transition:box-shadow .18s ease, transform .08s ease}
.btn.acc{border-color:transparent;background:var(--acc);color:#fff}
.btn:hover{box-shadow:0 4px 14px rgba(0,0,0,.08);transform:translateY(-1px)}

.section{margin-top:46px}
.section-head{display:flex;align-items:end;justify-content:space-between;gap:18px;margin-bottom:16px}
.section-head h2{font-size:29px;margin-top:4px}
.section-head>a{text-decoration:none;font-size:14px}

.grid{display:grid;gap:18px}
.cols-3{grid-template-columns:1fr}
.cols-2{grid-template-columns:1fr}
@media(min-width:800px){.cols-2{grid-template-columns:1fr 1fr}}
@media(min-width:980px){.cols-3{grid-template-columns:2fr 1fr 1fr}}

.research-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.research-card{min-height:168px}
.research-primary{min-height:192px}
.research-primary h3{font-size:21px}
.research-emerging{background:linear-gradient(180deg,#fff,#fbfcfe)}
.research-kicker{font-size:10px;font-weight:750;letter-spacing:.12em;color:#7a8494;margin-bottom:8px}
.research-directions{display:grid;gap:20px;margin-top:20px}
.research-feature{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(300px,.9fr);overflow:hidden}
.research-feature-text{padding:24px}
.research-feature h3{font-size:22px;margin-bottom:8px}
.research-figure-placeholder{
  min-height:220px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:4px;
  padding:22px;
  border-left:1px dashed var(--b);
  background:
    linear-gradient(135deg,rgba(141,26,17,.035),rgba(14,165,165,.035)),
    repeating-linear-gradient(45deg,transparent,transparent 14px,rgba(30,58,138,.025) 14px,rgba(30,58,138,.025) 15px);
  color:var(--muted);
  text-align:center
}
.research-figure-placeholder span{font-size:14px;font-weight:700;letter-spacing:.02em}
.research-figure-placeholder small{font-size:12px}
.card{border:1px solid var(--b);border-radius:var(--r);background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.card.pad{padding:20px}
.card.accent{border-left:4px solid var(--acc)}

h1,h2,h3{line-height:1.25;margin:0 0 6px}
h2{font-size:22px;margin-top:8px}
h3{font-size:18px}
p{margin:8px 0 0}
.muted{color:var(--muted)}
a{color:var(--acc);text-underline-offset:2px}
a:hover{opacity:.9}

ul.news{list-style:none;padding:0;margin:0}
ul.news li{display:flex;justify-content:space-between;gap:20px;padding:14px 18px;border-top:1px solid var(--b)}
ul.news li:first-child{border-top:none}
time{color:#6b7280;white-space:nowrap}

.page-intro{padding:26px 0 20px}
.page-intro h1{font-size:42px;letter-spacing:-.025em;margin-top:5px}
.page-intro p{max-width:760px}

.pub-list{display:grid;gap:14px;margin-top:8px}
.pub-item{display:grid;grid-template-columns:76px 1fr;overflow:hidden}
.pub-side{display:flex;align-items:flex-start;justify-content:center;padding:23px 12px;background:#f5f7fb;border-right:1px solid var(--b)}
.pub-side span{font-size:12px;font-weight:800;letter-spacing:.1em;color:#1e3a8a}
.pub-main{padding:20px 22px 18px}
.pub-main h3{font-size:19px;max-width:860px}
.pub-authors{font-size:15px;line-height:1.55}
.pub-meta{color:var(--muted);font-size:15px}
.pub-links{font-size:14px;margin-top:10px}
.pub-links a{text-decoration:none;font-weight:650}
.pub-note{display:inline-block;margin-left:6px;padding:2px 7px;border-radius:999px;background:#eef2ff;color:#1e3a8a;font-style:normal;font-size:12px}

table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:10px 12px}
thead{background:#0f1b31}
thead th{color:#fff;font-weight:700}
tr+tr{border-top:1px solid var(--b)}

footer.site-footer{border-top:1px solid var(--b);padding:26px 0;color:#667085}
footer.site-footer a{color:inherit}
footer.site-footer .wrap{display:flex;flex-wrap:wrap;gap:14px}

pre,code{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace}
pre{background:#0b1220;color:#e6edf3;border-radius:12px;padding:14px;overflow:auto}
code{background:#eef2ff;padding:2px 6px;border-radius:6px}

@media(max-width:860px){
  .hero-split{grid-template-columns:1fr}
  .research-feature{grid-template-columns:1fr}
  .research-figure-placeholder{border-left:none;border-top:1px dashed var(--b);min-height:180px}
  .hero-visual{min-height:220px;max-width:520px}
  .research-grid{grid-template-columns:1fr}
}
@media(max-width:700px){
  .h-row{height:auto;min-height:64px;align-items:flex-start;padding-top:12px;padding-bottom:12px}
  .nav{display:flex;flex-wrap:wrap;justify-content:flex-end}
  .nav a{margin:0 2px;padding:7px 9px}
  .hero{padding-top:44px}
  .section-head{align-items:flex-start;flex-direction:column}
  ul.news li{flex-direction:column;gap:4px}
  .pub-item{grid-template-columns:1fr}
  .pub-side{justify-content:flex-start;padding:10px 18px;border-right:none;border-bottom:1px solid var(--b)}
  .pub-main{padding:18px}
}

.theme-toggle{
  margin-left:6px;
  padding:8px 11px;
  border:1px solid var(--b);
  border-radius:10px;
  background:#fff;
  color:#14203a;
  font:600 13px/1 system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;
  cursor:pointer;
}
.theme-toggle:hover{background:#f5f7fb}
html[data-theme="dark"]{color-scheme:dark}
html[data-theme="light"]{color-scheme:light}
html[data-theme="dark"]{
  --paper:#0b1020;--ink:#e6edf3;--muted:#9aa4b2;--b:#1a2138
}
html[data-theme="dark"] body{background:var(--paper)}
html[data-theme="dark"] .site-header{background:linear-gradient(180deg,rgba(16,24,40,.85),rgba(16,24,40,.78));border-color:var(--b)}
html[data-theme="dark"] .nav a{color:#e6edf3}
html[data-theme="dark"] .nav a:hover{background:rgba(14,165,165,.16)}
html[data-theme="dark"] .nav a.active{background:#8d1a11}
html[data-theme="dark"] .hero-visual{background:linear-gradient(145deg,rgba(30,58,138,.16),rgba(14,165,165,.08)),#0f1629}
html[data-theme="dark"] .visual-label{background:rgba(15,22,41,.78);border-color:#25304d}
html[data-theme="dark"] .card{background:#0f1629;border-color:var(--b)}
html[data-theme="dark"] .research-emerging{background:#0f1629}
html[data-theme="dark"] .btn{background:#0f1629;color:#e6edf3}
html[data-theme="dark"] .btn.acc{background:var(--acc);color:#fff}
html[data-theme="dark"] .pub-side{background:#0f1b31}
html[data-theme="dark"] .pub-side span{color:#93c5fd}
html[data-theme="dark"] .pub-note{background:#142348;color:#93c5fd}
html[data-theme="dark"] thead{background:#0f1b31}
html[data-theme="dark"] pre{background:#0f1629;color:#e6edf3}
html[data-theme="dark"] code{background:#0f1b31}
html[data-theme="dark"] footer.site-footer{border-color:var(--b);color:#9aa4b2}
html[data-theme="dark"] .theme-toggle{background:#0f1629;color:#e6edf3;border-color:var(--b)}
html[data-theme="dark"] .theme-toggle:hover{background:#16213b}

html[data-theme="light"]{
  --paper:#f9fafb;--ink:#0b1020;--muted:#5a6475;--b:#e6e6e6
}
html[data-theme="light"] body{
  background:radial-gradient(1200px 500px at 50% -200px, rgba(141,26,17,.05), transparent 60%),var(--paper)
}
html[data-theme="light"] .site-header{
  background:linear-gradient(180deg, rgba(255,255,255,.92), rgba(255,255,255,.86));
  border-color:var(--b)
}
html[data-theme="light"] .nav a{color:#14203a}
html[data-theme="light"] .card{background:#fff;border-color:var(--b)}
html[data-theme="light"] .btn{background:#fff;color:#111}
html[data-theme="light"] .btn.acc{background:var(--acc);color:#fff}
html[data-theme="light"] .theme-toggle{background:#fff;color:#14203a;border-color:var(--b)}

@media(prefers-color-scheme:dark){
  :root{--paper:#0b1020;--ink:#e6edf3;--muted:#9aa4b2;--b:#1a2138}
  body{background:var(--paper)}
  .site-header{background:linear-gradient(180deg,rgba(16,24,40,.85),rgba(16,24,40,.78));border-color:var(--b)}
  .nav a{color:#e6edf3}.nav a:hover{background:rgba(14,165,165,.16)}.nav a.active{background:#8d1a11}
  .hero-visual{background:linear-gradient(145deg,rgba(30,58,138,.16),rgba(14,165,165,.08)),#0f1629}
  .visual-label{background:rgba(15,22,41,.78);border-color:#25304d}
  .card{background:#0f1629;border-color:var(--b)}
  .research-emerging{background:#0f1629}
  .btn{background:#0f1629;color:#e6edf3}.btn.acc{background:var(--acc);color:#fff}
  .pub-side{background:#0f1b31}
  .pub-note{background:#142348}
  thead{background:#0f1b31}
  pre{background:#0f1629;color:#e6edf3}
  code{background:#0f1b31}
  footer.site-footer{border-color:var(--b);color:#9aa4b2}
}

  </style>
</head>
<body>
<a class="sr-only skip" href="#main">Skip to content</a>

<header class="site-header">
  <div class="wrap h-row">
<nav class="nav" aria-label="Main">
      {%- assign here = page.url -%}
      <a href="https://sunohao.github.io/" class="{% if here == "/" %}active{% endif %}">Home</a>
      <a href="https://sunohao.github.io/research.html" class="{% if here contains "/research" %}active{% endif %}">Research</a>
      <a href="https://sunohao.github.io/publications.html" class="{% if here contains "/publications" %}active{% endif %}">Publications</a>
      <a href="https://sunohao.github.io/code.html" class="{% if here contains "/code" %}active{% endif %}">Code</a>
      <a href="https://sunohao.github.io/teaching.html" class="{% if here contains "/teaching" %}active{% endif %}">Teaching</a>
      <a href="https://sunohao.github.io/cv.html" class="{% if here contains "/cv" %}active{% endif %}">CV</a>
      <a href="https://sunohao.github.io/contact.html" class="{% if here contains "/contact" %}active{% endif %}">Contact</a>
    </nav>
    <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle light and dark theme">Dark</button>
  </div>
</header>

<main id="main" class="wrap">
  {{ content }}
</main>

<footer class="site-footer">
  <div class="wrap muted">
    © {{ site.time | date: "%Y" }} {{ site.author.name }} ·
    <a href="https://orcid.org/{{ site.author.orcid }}" target="_blank" rel="noreferrer">ORCID</a> ·
    <a href="https://scholar.google.com/citations?hl=en&user=YmrbkGIAAAAJ&view_op=list_works" target="_blank" rel="noreferrer">Google Scholar</a> ·
    <a href="https://www.researchgate.net/profile/Hao-Sun-30?ev=hdr_xprf" target="_blank" rel="noreferrer">ResearchGate</a> ·
    <a href="https://github.com/sunohao" target="_blank" rel="noreferrer">GitHub</a> ·
    <a href="mailto:{{ site.author.email }}">Email</a>
  </div>
</footer>
<script>
(function(){
  const root = document.documentElement;
  const btn = document.getElementById("theme-toggle");
  const saved = localStorage.getItem("theme");

  function systemTheme(){
    return window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  }
  function apply(theme){
    root.setAttribute("data-theme", theme);
    if (btn) btn.textContent = theme === "dark" ? "Light" : "Dark";
  }

  apply(saved || systemTheme());

  if (btn) {
    btn.addEventListener("click", function(){
      const next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
      localStorage.setItem("theme", next);
      apply(next);
    });
  }

  window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", function(){
    if (!localStorage.getItem("theme")) apply(systemTheme());
  });
})();
</script>
<!-- deploy-refresh -->
</body>
</html>
